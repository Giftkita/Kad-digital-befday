<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Happy Birthday 🎂</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Dancing+Script:wght@600;700&family=Playfair+Display:ital,wght@1,400;1,600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Poppins',sans-serif}

/* ── LOADING ── */
#loading{position:fixed;inset:0;background:linear-gradient(135deg,#fce4ec,#f8bbd0);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;gap:1rem}
.ld-heart{font-size:3rem;animation:hb 1s ease-in-out infinite}
@keyframes hb{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
.ld-txt{font-size:.8rem;color:#e91e63;letter-spacing:.1em}

/* ── SLIDE SYSTEM ── */
.slide{position:fixed;inset:0;display:none;opacity:0;transition:opacity .6s ease}
.slide.active{display:flex;opacity:1}
.slide.prev{opacity:0;pointer-events:none}

/* NAV ARROWS */
.nav-prev,.nav-next{
  position:fixed;top:50%;transform:translateY(-50%);
  z-index:50;background:rgba(255,255,255,.25);backdrop-filter:blur(8px);
  border:1.5px solid rgba(255,255,255,.5);border-radius:50%;
  width:40px;height:40px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:1rem;color:#fff;transition:.2s;
  text-shadow:0 1px 3px rgba(0,0,0,.3);
}
.nav-prev{left:10px}.nav-next{right:10px}
.nav-prev:hover,.nav-next:hover{background:rgba(255,255,255,.4)}

/* Slide dots */
.dots{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:7px;z-index:50}
.dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.4);border:1.5px solid rgba(255,255,255,.6);transition:.3s;cursor:pointer}
.dot.on{background:#fff;transform:scale(1.25)}

/* ════════════════════
   SLIDE 1 — COVER
════════════════════ */
#s1{
  background:linear-gradient(160deg,#1a0a2e,#3d1166,#6a1b9a);
  flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:2rem;overflow:hidden;
  position:relative;
}
.s1-stars{position:absolute;inset:0;pointer-events:none}
.star{position:absolute;background:#fff;border-radius:50%;animation:twinkle linear infinite}
@keyframes twinkle{0%,100%{opacity:.2;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}
.s1-title{
  font-family:'Playfair Display',serif;font-style:italic;
  font-size:clamp(2.2rem,9vw,4rem);color:#fff;
  line-height:1.1;letter-spacing:-.01em;
  text-shadow:0 0 40px rgba(255,150,200,.5);
  animation:titleIn 1.2s cubic-bezier(.22,1,.36,1) .3s both;
  margin-bottom:.5rem;
}
@keyframes titleIn{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
.s1-sub{
  font-size:clamp(.85rem,3.5vw,1.2rem);
  color:rgba(255,200,220,.8);letter-spacing:.08em;
  animation:titleIn 1s .7s both;margin-bottom:2rem;
}
.s1-heart{font-size:clamp(2rem,8vw,3.5rem);animation:heartFloat 2.5s ease-in-out infinite,titleIn 1s .5s both}
@keyframes heartFloat{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-12px) scale(1.08)}}
/* Confetti bg */
.s1-confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.cf{position:absolute;font-size:1rem;animation:cfFall linear infinite;opacity:.6}
@keyframes cfFall{0%{transform:translateY(-30px) rotate(0)}100%{transform:translateY(110vh) rotate(720deg);opacity:0}}

/* ════════════════════
   SLIDE 2 — WISHES
════════════════════ */
#s2{background:linear-gradient(135deg,#fff9fc,#fce4ec);align-items:center;justify-content:center;padding:1.5rem}
.s2-inner{display:flex;gap:1.2rem;align-items:center;width:100%;max-width:680px;flex-wrap:wrap;justify-content:center}
.wishes-card{
  flex:1;min-width:220px;max-width:340px;
  background:#fff;border-radius:20px;padding:1.5rem;
  box-shadow:0 8px 30px rgba(233,30,99,.1);
}
.wishes-title{font-family:'Dancing Script',cursive;font-size:clamp(1.2rem,5vw,1.8rem);color:#e91e63;margin-bottom:1rem}
.wish-item{
  display:flex;align-items:flex-start;gap:.6rem;
  padding:.5rem 0;border-bottom:1px dashed #fce4ec;
  font-size:clamp(.7rem,2.5vw,.85rem);color:#555;line-height:1.5;
}
.wish-item:last-child{border-bottom:none}
.wish-num{width:22px;height:22px;background:#e91e63;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.6rem;font-weight:700;flex-shrink:0}
.s2-img{
  flex:0 0 auto;width:clamp(130px,35vw,200px);
  border-radius:16px;overflow:hidden;
  box-shadow:0 8px 24px rgba(0,0,0,.12);
  aspect-ratio:1;
}
.s2-img img{width:100%;height:100%;object-fit:cover}

/* ════════════════════
   SLIDE 3 — POLAROIDS
════════════════════ */
#s3{
  background:linear-gradient(135deg,#1a0a1a,#2d1133);
  align-items:center;justify-content:center;padding:1.5rem;
  position:relative;overflow:hidden;
}
#s3::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 30%,rgba(233,30,99,.2),transparent 70%);pointer-events:none}
.s3-title{
  position:absolute;top:1.2rem;left:50%;transform:translateX(-50%);
  font-family:'Dancing Script',cursive;font-size:clamp(1rem,4vw,1.5rem);
  color:rgba(255,200,220,.7);white-space:nowrap;letter-spacing:.05em;
}
.polaroids-row{display:flex;gap:clamp(.6rem,2vw,1.2rem);justify-content:center;align-items:flex-end;padding-top:2.5rem}
.polaroid{
  background:#fff;padding:clamp(.4rem,1.5vw,.6rem) clamp(.4rem,1.5vw,.6rem) clamp(1.8rem,5vw,2.5rem);
  box-shadow:0 12px 40px rgba(0,0,0,.4);
  transition:.3s;cursor:pointer;
}
.polaroid:nth-child(1){transform:rotate(-5deg)}
.polaroid:nth-child(2){transform:rotate(2deg);margin-bottom:12px}
.polaroid:nth-child(3){transform:rotate(-3deg)}
.polaroid:hover{transform:rotate(0) scale(1.05)!important;z-index:2}
.pol-img{
  width:clamp(90px,25vw,145px);aspect-ratio:1;
  background:#f5f5f5;overflow:hidden;display:flex;align-items:center;justify-content:center;
}
.pol-img img{width:100%;height:100%;object-fit:cover}
.pol-txt{text-align:center;font-size:clamp(.42rem,1.6vw,.6rem);color:#888;margin-top:.4rem;font-style:italic;padding:0 .2rem}

/* ════════════════════
   SLIDE 4 — QUOTE
════════════════════ */
#s4{
  background:linear-gradient(160deg,#0d0d1a,#1a1a2e,#162447);
  align-items:center;justify-content:center;padding:2rem;
  position:relative;overflow:hidden;
}
.quote-deco{position:absolute;font-size:12rem;color:rgba(255,255,255,.03);font-family:Georgia,serif;top:-2rem;left:-1rem;line-height:1;pointer-events:none}
.quote-card{
  max-width:480px;text-align:center;
  animation:quoteIn 1s .2s both;
}
@keyframes quoteIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
.quote-marks{font-size:clamp(3rem,10vw,5rem);color:rgba(233,30,99,.4);line-height:.5;font-family:Georgia,serif;margin-bottom:.5rem}
.quote-text{
  font-family:'Playfair Display',serif;font-style:italic;
  font-size:clamp(1.3rem,5.5vw,2.2rem);color:#fff;
  line-height:1.4;letter-spacing:-.01em;
  text-shadow:0 0 30px rgba(233,30,99,.3);
}
.quote-author{
  margin-top:1.5rem;
  font-size:clamp(.7rem,2.5vw,.9rem);color:rgba(255,150,180,.6);
  letter-spacing:.2em;text-transform:uppercase;
  display:flex;align-items:center;justify-content:center;gap:.6rem;
}
.quote-author::before,.quote-author::after{content:'';flex:1;max-width:60px;height:1px;background:rgba(255,150,180,.3)}

/* ════════════════════
   SLIDE 5 — STORY
════════════════════ */
#s5{background:linear-gradient(135deg,#fff9fc,#fce4ec);align-items:center;justify-content:center;padding:1.5rem}
.s5-inner{display:flex;gap:1.2rem;align-items:center;width:100%;max-width:680px;flex-wrap:wrap;justify-content:center}
.story-card{
  flex:1;min-width:220px;max-width:360px;
  background:#fff;border-radius:20px;padding:1.5rem;
  box-shadow:0 8px 30px rgba(233,30,99,.1);
}
.story-title{font-family:'Dancing Script',cursive;font-size:clamp(1.1rem,4.5vw,1.6rem);color:#e91e63;margin-bottom:.8rem}
.story-text{font-size:clamp(.7rem,2.5vw,.85rem);color:#555;line-height:1.8;white-space:pre-line}
.s5-img{
  flex:0 0 auto;width:clamp(130px,35vw,200px);
  border-radius:16px;overflow:hidden;
  box-shadow:0 8px 24px rgba(0,0,0,.12);
  aspect-ratio:3/4;
}
.s5-img img{width:100%;height:100%;object-fit:cover}

/* ════════════════════
   SLIDE 6 — GIFT BOX
════════════════════ */
#s6{
  background:linear-gradient(160deg,#1a0520,#3d0d4a,#6a1b9a);
  align-items:center;justify-content:center;padding:1.5rem;
  position:relative;overflow:hidden;flex-direction:column;gap:1rem;
}
.gift-title{
  font-family:'Dancing Script',cursive;
  font-size:clamp(1rem,4.5vw,1.5rem);color:rgba(255,200,240,.7);
  letter-spacing:.05em;
}
/* 3D Gift Box */
.gift-scene{perspective:600px;cursor:pointer}
.gift-box{
  position:relative;
  width:clamp(120px,32vw,160px);height:clamp(120px,32vw,160px);
  transform-style:preserve-3d;
  animation:boxFloat 3s ease-in-out infinite;
  transition:transform .5s;
}
@keyframes boxFloat{0%,100%{transform:translateY(0) rotateY(-15deg)}50%{transform:translateY(-10px) rotateY(15deg)}}
.gift-box.opened{animation:none!important;transform:scale(1.1)}

.box-body{
  position:absolute;inset:0;
  background:linear-gradient(135deg,#e91e63,#c2185b);
  border-radius:12px;
  box-shadow:0 20px 60px rgba(233,30,99,.4);
  display:flex;align-items:center;justify-content:center;
  font-size:3rem;
}
.box-body::before{
  content:'';position:absolute;
  top:50%;left:0;right:0;height:3px;
  background:rgba(255,255,255,.4);
}
.box-body::after{
  content:'';position:absolute;
  top:0;bottom:0;left:50%;width:3px;
  background:rgba(255,255,255,.4);
}
/* Ribbon bow */
.box-bow{
  position:absolute;top:-16px;left:50%;transform:translateX(-50%);
  font-size:2rem;animation:bowWiggle 2s ease-in-out infinite;
}
@keyframes bowWiggle{0%,100%{transform:translateX(-50%) rotate(-5deg)}50%{transform:translateX(-50%) rotate(5deg)}}

/* Surprise reveal */
.surprise-overlay{
  position:fixed;inset:0;z-index:100;
  background:rgba(0,0,0,.88);
  display:none;align-items:center;justify-content:center;flex-direction:column;
  gap:1rem;padding:1.5rem;
  animation:overlayIn .5s ease;
}
.surprise-overlay.on{display:flex}
@keyframes overlayIn{from{opacity:0}to{opacity:1}}
.surprise-img-wrap{
  width:min(85vw,360px);border-radius:20px;overflow:hidden;
  box-shadow:0 20px 60px rgba(233,30,99,.5);
  animation:surpriseIn .7s cubic-bezier(.22,1,.36,1);
}
@keyframes surpriseIn{from{transform:scale(.5) rotate(-10deg);opacity:0}to{transform:none;opacity:1}}
.surprise-img-wrap img{width:100%;display:block}
.surprise-msg{
  font-family:'Dancing Script',cursive;
  font-size:clamp(1.2rem,5vw,1.8rem);
  color:#fff;text-align:center;
  animation:surpriseIn .7s .2s both;
}
.surprise-close{
  background:rgba(255,255,255,.15);border:1.5px solid rgba(255,255,255,.3);
  color:#fff;padding:.6rem 1.5rem;border-radius:50px;cursor:pointer;
  font-family:'Poppins',sans-serif;font-size:.8rem;
  animation:surpriseIn .5s .4s both;
}

/* Confetti overlay */
.conf-wrap{position:fixed;inset:0;pointer-events:none;z-index:101;overflow:hidden}
.conf-cf{position:absolute;top:-20px;animation:cfFall linear infinite}

/* ── MUSIC BAR ── */
#mbar{
  position:fixed;bottom:0;left:0;right:0;z-index:200;
  background:rgba(10,0,18,.9);backdrop-filter:blur(16px);
  border-top:1px solid rgba(233,30,99,.15);
  padding:.5rem 1rem;display:none;align-items:center;gap:.7rem;
}
#mbar.on{display:flex}
.mb-disc{
  width:26px;height:26px;border-radius:50%;flex-shrink:0;
  background:conic-gradient(#e91e63 0deg,#880e4f 180deg,#e91e63 360deg);
}
.mb-disc.sp{animation:spin 2.5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.mb-info{flex:1;min-width:0}
.mb-title{font-size:.62rem;color:rgba(255,200,220,.7);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-style:italic}
.mb-prog{flex:1;height:2px;background:rgba(255,255,255,.1);cursor:pointer;border-radius:1px;min-width:40px}
.mb-fill{height:100%;background:linear-gradient(to right,#e91e63,#f06292);border-radius:1px;width:0;transition:width .8s linear}
.mb-btn{background:rgba(255,255,255,.08);border:none;border-radius:50%;width:24px;height:24px;cursor:pointer;color:rgba(255,255,255,.6);font-size:.7rem;display:flex;align-items:center;justify-content:center;flex-shrink:0}
</style>
</head>
<body>

<!-- Loading -->
<div id="loading">
  <div class="ld-heart">💝</div>
  <p class="ld-txt">Memuatkan kad...</p>
</div>

<!-- Slide 1: Cover -->
<div class="slide" id="s1">
  <div class="s1-stars" id="stars"></div>
  <div class="s1-confetti" id="cf1"></div>
  <div class="s1-heart" id="s1-heart">💝</div>
  <h1 class="s1-title" id="s1-title">Happy Birthday</h1>
  <p class="s1-sub" id="s1-sub">Sayang 💕</p>
</div>

<!-- Slide 2: Wishes -->
<div class="slide" id="s2">
  <div class="s2-inner">
    <div class="wishes-card">
      <p class="wishes-title">Doa & Harapan 🌸</p>
      <div id="wishes-list"></div>
    </div>
    <div class="s2-img"><img id="cake-img" src="" alt=""></div>
  </div>
</div>

<!-- Slide 3: Polaroids -->
<div class="slide" id="s3">
  <p class="s3-title">📸 Kenangan Kita</p>
  <div class="polaroids-row">
    <div class="polaroid"><div class="pol-img"><img id="pol1" src="" alt=""></div><p class="pol-txt" id="pol1-txt"></p></div>
    <div class="polaroid"><div class="pol-img"><img id="pol2" src="" alt=""></div><p class="pol-txt" id="pol2-txt"></p></div>
    <div class="polaroid"><div class="pol-img"><img id="pol3" src="" alt=""></div><p class="pol-txt" id="pol3-txt"></p></div>
  </div>
</div>

<!-- Slide 4: Quote -->
<div class="slide" id="s4">
  <div class="quote-deco">"</div>
  <div class="quote-card">
    <div class="quote-marks">"</div>
    <p class="quote-text" id="quote-text">I Always Love You</p>
    <p class="quote-author" id="quote-author">Your Beloved</p>
  </div>
</div>

<!-- Slide 5: Story -->
<div class="slide" id="s5">
  <div class="s5-inner">
    <div class="story-card">
      <p class="story-title">Cerita Kita 💌</p>
      <p class="story-text" id="story-text"></p>
    </div>
    <div class="s5-img"><img id="story-img" src="" alt=""></div>
  </div>
</div>

<!-- Slide 6: Gift Box -->
<div class="slide" id="s6">
  <p class="gift-title">Kejutan untuk kamu 🎁</p>
  <div class="gift-scene" onclick="openBox()">
    <div class="gift-box" id="gift-box">
      <div class="box-body">🎁</div>
      <div class="box-bow">🎀</div>
    </div>
  </div>
  <p style="font-size:.7rem;color:rgba(255,200,240,.4);margin-top:.5rem;letter-spacing:.08em">ketuk untuk buka</p>
</div>

<!-- Surprise overlay -->
<div class="surprise-overlay" id="surprise" onclick="closeSurprise(event)">
  <div class="surprise-img-wrap"><img id="surprise-img" src="" alt=""></div>
  <p class="surprise-msg" id="surprise-msg">Happy Birthday! ❤️</p>
  <button class="surprise-close">✕ Tutup</button>
  <div class="conf-wrap" id="conf2"></div>
</div>

<!-- Navigation -->
<div class="nav-prev" onclick="prev()">‹</div>
<div class="nav-next" onclick="next()">›</div>
<div class="dots" id="dots"></div>

<!-- Music bar -->
<div id="mbar">
  <div class="mb-disc" id="mb-disc"></div>
  <div class="mb-info"><p class="mb-title" id="mb-title">♪ Lagu Kita</p></div>
  <div class="mb-prog" onclick="seekMusic(event)"><div class="mb-fill" id="mb-fill"></div></div>
  <button class="mb-btn" id="mb-btn" onclick="togglePlay()">⏸</button>
</div>

<div id="yt-root" style="position:fixed;bottom:-200px;left:-200px;width:1px;height:1px;overflow:hidden"></div>

<script>
const SB_URL='https://lejpuajafuenlfvlovfg.supabase.co';
const SB_KEY='sb_publishable_igFE4w_dz4ZF99wH1LeBKg_JL5kFoZ0';
const db=window.supabase.createClient(SB_URL,SB_KEY);

const TOTAL=6;
let cur=0,D={};
const slides=()=>document.querySelectorAll('.slide');

/* ── INIT ── */
async function init(){
  buildDots();
  const p=new URLSearchParams(location.search);
  const id=p.get('id');
  if(!id){showErr('Link tidak sah');return}
  try{
    const{data,error}=await db.from('cards').select('card_data').eq('id',id).single();
    if(error)throw error;
    D=data.card_data;
    buildUI();
    hideLoading();
    goTo(0);
    buildStars();
    buildConfetti('cf1');
    setupMusic();
  }catch(e){
    showErr('Kad tidak dijumpai atau telah tamat tempoh.');
  }
}

function buildUI(){
  // S1
  document.getElementById('s1-title').textContent=D.title||'Happy Birthday';
  document.getElementById('s1-sub').textContent=D.subtitle||'💕';

  // S2
  document.getElementById('cake-img').src=D.cake_img||'';
  const wl=document.getElementById('wishes-list');
  (D.wishes||'').split('\n').filter(Boolean).forEach((w,i)=>{
    const d=document.createElement('div');d.className='wish-item';
    d.innerHTML=`<div class="wish-num">${i+1}</div><span>${w}</span>`;
    wl.appendChild(d);
  });

  // S3
  document.getElementById('pol1').src=D.p1_img||'';
  document.getElementById('pol2').src=D.p2_img||'';
  document.getElementById('pol3').src=D.p3_img||'';
  document.getElementById('pol1-txt').textContent=D.p1_txt||'';
  document.getElementById('pol2-txt').textContent=D.p2_txt||'';
  document.getElementById('pol3-txt').textContent=D.p3_txt||'';

  // S4
  document.getElementById('quote-text').textContent=D.quote||'';
  document.getElementById('quote-author').textContent=D.author||'';

  // S5
  document.getElementById('story-text').textContent=D.story||'';
  document.getElementById('story-img').src=D.story_img||'';

  // S6
  document.getElementById('surprise-img').src=D.surprise_img||'';
  document.getElementById('surprise-msg').textContent=D.surprise_msg||'Happy Birthday! ❤️';
}

/* ── NAVIGATION ── */
function goTo(n){
  slides().forEach((s,i)=>{
    s.classList.remove('active');
  });
  slides()[n].classList.add('active');
  cur=n;
  document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('on',i===n));
  // Show/hide nav
  document.querySelector('.nav-prev').style.opacity=cur===0?'0.2':'1';
  document.querySelector('.nav-next').style.opacity=cur===TOTAL-1?'0.2':'1';
}
function next(){if(cur<TOTAL-1)goTo(cur+1)}
function prev(){if(cur>0)goTo(cur-1)}
function buildDots(){
  const c=document.getElementById('dots');
  for(let i=0;i<TOTAL;i++){
    const d=document.createElement('div');d.className='dot';
    d.onclick=()=>goTo(i);c.appendChild(d);
  }
}

// Swipe support
let tx=0;
document.addEventListener('touchstart',e=>tx=e.touches[0].clientX,{passive:true});
document.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx;
  if(Math.abs(dx)>50){dx<0?next():prev()}
},{passive:true});

/* ── GIFT BOX ── */
function openBox(){
  document.getElementById('gift-box').classList.add('opened');
  setTimeout(()=>{
    document.getElementById('surprise').classList.add('on');
    buildConfetti('conf2');
  },400);
}
function closeSurprise(e){
  if(e.target.closest('.surprise-img-wrap')&&!e.target.closest('button'))return;
  document.getElementById('surprise').classList.remove('on');
}

/* ── STARS ── */
function buildStars(){
  const c=document.getElementById('stars');
  for(let i=0;i<80;i++){
    const s=document.createElement('div');s.className='star';
    const sz=1+Math.random()*2.5;
    s.style.cssText=`width:${sz}px;height:${sz}px;top:${Math.random()*100}%;left:${Math.random()*100}%;animation-duration:${2+Math.random()*4}s;animation-delay:-${Math.random()*4}s`;
    c.appendChild(s);
  }
}

/* ── CONFETTI ── */
function buildConfetti(id){
  const c=document.getElementById(id);if(!c)return;c.innerHTML='';
  const items=['🎉','💕','💖','🌸','✨','🎊','💝','❤️','🌟'];
  for(let i=0;i<30;i++){
    const cf=document.createElement('div');cf.className='cf';
    cf.style.cssText=`left:${Math.random()*100}vw;font-size:${.8+Math.random()*.8}rem;animation-duration:${2+Math.random()*3}s;animation-delay:${Math.random()*2}s`;
    cf.textContent=items[Math.floor(Math.random()*items.length)];
    c.appendChild(cf);
  }
}

/* ── MUSIC ── */
let ytp=null,ytReady=false,ytPlaying=false;
function setupMusic(){
  if(!D.yt)return;
  const m=D.yt.match(/(?:youtu\.be\/|[?&]v=)([a-zA-Z0-9_-]{11})/);
  if(!m)return;
  const ytId=m[1];
  document.getElementById('mb-title').textContent='♪ Lagu Kita';
  document.getElementById('mbar').classList.add('on');
  const s=document.createElement('script');
  s.src='https://www.youtube.com/iframe_api';
  document.head.appendChild(s);
  window.onYouTubeIframeAPIReady=()=>{
    ytp=new YT.Player('yt-root',{
      width:'1',height:'1',videoId:ytId,
      playerVars:{autoplay:0,controls:0,disablekb:1,fs:0,rel:0,playsinline:1},
      events:{
        onReady:()=>{ytReady=true;ytp.playVideo()},
        onStateChange:e=>{
          if(e.data===1){ytPlaying=true;document.getElementById('mb-disc').classList.add('sp');document.getElementById('mb-btn').textContent='⏸';updateBar()}
          else if(e.data===2||e.data===0){ytPlaying=false;document.getElementById('mb-disc').classList.remove('sp');document.getElementById('mb-btn').textContent='▶'}
        }
      }
    });
  };
}
function togglePlay(){if(ytp&&ytReady){ytPlaying?ytp.pauseVideo():ytp.playVideo()}}
function seekMusic(e){if(!ytp||!ytReady)return;const r=e.currentTarget.getBoundingClientRect();ytp.seekTo((e.clientX-r.left)/r.width*ytp.getDuration(),true)}
function updateBar(){
  if(!ytPlaying||!ytp||!ytReady)return;
  const pct=ytp.getCurrentTime()/ytp.getDuration()*100;
  document.getElementById('mb-fill').style.width=pct+'%';
  setTimeout(updateBar,800);
}

/* ── UTILS ── */
function hideLoading(){
  const l=document.getElementById('loading');
  l.style.transition='opacity .8s';l.style.opacity='0';
  setTimeout(()=>l.style.display='none',800);
}
function showErr(msg){
  const l=document.getElementById('loading');
  l.innerHTML=`<div style="font-size:2.5rem">💔</div><p style="color:#e91e63;font-size:.85rem;text-align:center;padding:0 1.5rem">${msg}</p>`;
}

init();
</script>
