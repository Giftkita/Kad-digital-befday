<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>💌 Untuk Kamu</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#fdf5f5}
body{font-family:'Nunito',sans-serif}

.pg{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column}
.pg.on{display:flex}
.pg.fade-in{animation:fadeIn .5s ease both}
@keyframes fadeIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}

/* ══════════════════════
   PAGE 0 — LOADING
══════════════════════ */
#p-load{background:#fdf5f5}
.load-heart{font-size:3rem;animation:heartBeat 1s ease-in-out infinite}
@keyframes heartBeat{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
.load-txt{font-size:.82rem;color:rgba(180,80,100,.5);margin-top:.8rem;letter-spacing:.1em}

/* ══════════════════════
   PAGE 1 — ENVELOPE
══════════════════════ */
#p-env{background:#fdf5f5;gap:2rem}

.env-scene{
  position:relative;
  width:clamp(200px,55vw,260px);
  cursor:pointer;
  animation:envFloat 3s ease-in-out infinite;
  filter:drop-shadow(0 12px 30px rgba(200,80,100,.15));
}
@keyframes envFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.env-scene:active{transform:scale(.95)!important;animation:none!important}

/* Envelope SVG flap */
.env-flap{
  transform-origin:50% 35%;
  transform-box:fill-box;
  transition:transform 1s cubic-bezier(.65,0,.25,1);
}
.env-scene.opening .env-flap{
  transform:perspective(600px) rotateX(-185deg);
}
.env-scene.gone{
  opacity:0;transform:scale(.88) translateY(12px)!important;
  transition:all .75s ease;pointer-events:none;
}

.env-hint{
  font-family:'Dancing Script',cursive;
  font-size:clamp(1rem,4vw,1.3rem);
  color:rgba(200,80,100,.45);
  letter-spacing:.05em;
  animation:hintPulse 2.5s ease-in-out infinite;
}
@keyframes hintPulse{0%,100%{opacity:.45}50%{opacity:.85}}

/* ══════════════════════
   PAGE 2 — HEART REVEAL
   White card, mochi left,
   hearts form on right
══════════════════════ */
#p-heart{background:#fdf5f5;padding:1.5rem}

.heart-card{
  background:#fff;
  border-radius:22px;
  width:min(90vw,380px);
  padding:1.2rem;
  box-shadow:0 4px 28px rgba(200,80,100,.1);
  position:relative;
  overflow:hidden;
  display:flex;
  align-items:flex-end;
  gap:.8rem;
  min-height:220px;
}

/* Photos collage — top area of card */
.photos-area{
  position:absolute;top:0;left:0;right:0;
  height:42%;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:2px;
  border-radius:20px 20px 0 0;
  overflow:hidden;
}
.photo-slot{
  background:linear-gradient(135deg,#ffd0d8,#ffb0bc);
  overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  font-size:1.2rem;
}
.photo-slot img{width:100%;height:100%;object-fit:cover}
.photo-slot:first-child{grid-column:span 2}

/* Bottom half — mochi + hearts */
.card-bottom{
  position:absolute;bottom:0;left:0;right:0;
  height:58%;
  display:flex;
  align-items:flex-end;
  padding:.8rem .9rem 1rem;
  gap:.5rem;
}

/* Mochi character */
.mochi{
  position:relative;
  width:clamp(60px,18vw,80px);
  height:clamp(72px,22vw,96px);
  flex-shrink:0;
  animation:mochiIdle 2s ease-in-out infinite;
}
@keyframes mochiIdle{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

.m-body{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:62%;height:46%;background:#f5f5f5;border-radius:48% 48% 42% 42%;border:2px solid rgba(0,0,0,.1)}
.m-body::before,.m-body::after{content:'';position:absolute;bottom:-26%;width:32%;height:36%;background:#f5f5f5;border-radius:50%;border:2px solid rgba(0,0,0,.1)}
.m-body::before{left:10%}
.m-body::after{right:10%}
.m-arm{position:absolute;bottom:42%;right:-16%;width:32%;height:18%;background:#f5f5f5;border-radius:50%;border:2px solid rgba(0,0,0,.1);transform:rotate(-25deg);transform-origin:left center;animation:armPt 2s ease-in-out infinite}
@keyframes armPt{0%,100%{transform:rotate(-25deg)}50%{transform:rotate(-15deg)}}
.m-head{position:absolute;top:0;left:50%;transform:translateX(-50%);width:68%;height:56%;background:#f5f5f5;border-radius:50%;border:2px solid rgba(0,0,0,.1);z-index:2}
.m-el,.m-er{position:absolute;top:42%;width:9%;height:10%;background:#1a1a1a;border-radius:50%}
.m-el{left:26%}.m-er{right:26%}
.m-smile{position:absolute;top:58%;left:50%;transform:translateX(-50%);width:26%;height:10%;border-bottom:2.5px solid rgba(0,0,0,.45);border-radius:0 0 50% 50%}
.m-bl,.m-br{position:absolute;top:50%;width:18%;height:11%;background:rgba(255,150,150,.45);border-radius:50%}
.m-bl{left:12%}.m-br{right:12%}
.m-heart{position:absolute;bottom:72%;right:-5%;font-size:.85rem;animation:hFloat 1.5s ease-in-out infinite}
@keyframes hFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px) scale(1.2)}}

/* Heart grid */
.heart-grid-wrap{flex:1;display:flex;align-items:center;justify-content:center}
.hg{position:relative;width:clamp(110px,32vw,155px);height:clamp(110px,32vw,155px)}
.h{
  position:absolute;
  line-height:1;
  opacity:0;
  transform:translate(-50%,-50%) scale(0);
  transition:opacity .15s,transform .28s cubic-bezier(.34,1.56,.64,1);
  font-size:clamp(12px,3.5vw,17px);
}
.h.on{opacity:1;transform:translate(-50%,-50%) scale(1)}

/* Name tag */
.nametag{
  position:absolute;top:.75rem;right:.85rem;
  font-size:clamp(.55rem,2vw,.7rem);
  color:rgba(0,0,0,.22);font-weight:700;
}

/* ══════════════════════
   PAGE 3 — UCAPAN
══════════════════════ */
#p-msg{
  background:linear-gradient(160deg,#fff5f6,#ffeef0);
  padding:2rem 1.5rem;text-align:center;gap:1rem;
}
.msg-deco{font-size:2rem;animation:heartBeat 2s ease-in-out infinite}
.msg-to{font-size:.72rem;letter-spacing:.28em;text-transform:uppercase;color:rgba(200,80,100,.45)}
.msg-name{font-family:'Dancing Script',cursive;font-size:clamp(2rem,8vw,3rem);color:#8a1530;line-height:1.1}
.msg-divider{display:flex;align-items:center;gap:.6rem;width:100%;max-width:320px}
.msg-line{flex:1;height:1px;background:linear-gradient(to right,transparent,rgba(200,80,100,.2),transparent)}
.msg-ico{font-size:.85rem;color:rgba(200,80,100,.35)}
.msg-text{
  font-size:clamp(1rem,4vw,1.3rem);
  color:rgba(80,30,40,.65);
  line-height:1.75;font-style:italic;
  white-space:pre-line;max-width:340px;
}
.msg-from{font-family:'Dancing Script',cursive;font-size:clamp(1rem,4vw,1.3rem);color:rgba(180,60,80,.6)}
.msg-nav{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);display:flex;gap:.7rem;z-index:10}
.msg-btn{font-family:'Dancing Script',cursive;font-size:.95rem;color:rgba(180,60,80,.4);background:none;border:none;cursor:pointer;letter-spacing:.05em;animation:hintPulse 3s ease-in-out infinite}

/* ══════════════════════
   PAGE 4 — VIDEO
══════════════════════ */
#p-vid{background:#0d0d0d;padding:2rem 1.5rem;gap:1.5rem}
.vid-title{font-family:'Dancing Script',cursive;font-size:clamp(1.1rem,4.5vw,1.6rem);color:rgba(255,180,190,.7);text-align:center}
.vid-frame{width:100%;max-width:420px;border-radius:12px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.7)}
.vid-frame iframe,.vid-frame video{width:100%;aspect-ratio:16/9;border:none;display:block}
.vid-divider{display:flex;align-items:center;gap:.7rem;width:100%;max-width:420px}
.vid-line{flex:1;height:1px;background:linear-gradient(to right,transparent,rgba(255,150,170,.12),transparent)}
.vid-back{font-family:'Dancing Script',cursive;font-size:.95rem;color:rgba(255,150,170,.35);background:none;border:none;cursor:pointer}

/* ══════════════════════
   MUSIC BAR
══════════════════════ */
#mbar{position:fixed;bottom:0;left:0;right:0;z-index:900;background:rgba(15,5,8,.94);backdrop-filter:blur(14px);border-top:1px solid rgba(255,150,170,.06);padding:.5rem 1rem;display:none;align-items:center;gap:.6rem}
#mbar.on{display:flex;animation:mbUp .4s ease}
@keyframes mbUp{from{transform:translateY(100%)}to{transform:none}}
.mbd{width:24px;height:24px;border-radius:50%;flex-shrink:0;background:repeating-conic-gradient(#1a0808 0deg,#2d1414 4deg,#1a0808 8deg);position:relative}
.mbd::before{content:'';position:absolute;inset:30%;border-radius:50%;background:#c04060}
.mbd::after{content:'';position:absolute;inset:44%;border-radius:50%;background:rgba(255,255,255,.75)}
.mbd.sp{animation:disc 2.5s linear infinite}
@keyframes disc{to{transform:rotate(360deg)}}
.mb-info{flex:1;min-width:0}
.mb-t{font-size:.67rem;color:rgba(255,200,210,.65);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-style:italic}
.mb-a{font-size:.54rem;color:rgba(255,255,255,.28)}
.mb-prog{flex:1;height:2px;background:rgba(255,255,255,.08);cursor:pointer;border-radius:1px;min-width:55px}
.mb-fill{height:100%;background:rgba(200,60,80,.45);border-radius:1px;width:0%}
.mb-btns{display:flex;gap:.35rem}
.mb-btn{background:rgba(255,255,255,.06);border:none;border-radius:50%;width:24px;height:24px;cursor:pointer;color:rgba(255,255,255,.52);font-size:.72rem;display:flex;align-items:center;justify-content:center}
</style>
</head>
<body>

<!-- LOADING -->
<div class="pg on" id="p-load">
  <div class="load-heart">❤️</div>
  <p class="load-txt">memuat hadiah...</p>
</div>

<!-- PAGE 1: ENVELOPE -->
<div class="pg" id="p-env">
  <div class="env-scene" id="env-scene" onclick="openEnv()">
    <svg viewBox="0 0 300 210" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block;overflow:visible">
      <defs>
        <linearGradient id="eb" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fff0f2"/><stop offset="100%" stop-color="#ffd8de"/></linearGradient>
        <linearGradient id="ef" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fff5f6"/><stop offset="100%" stop-color="#ffdee2"/></linearGradient>
        <radialGradient id="sg" cx="38%" cy="34%"><stop offset="0%" stop-color="#f09aaa"/><stop offset="55%" stop-color="#e06880"/><stop offset="100%" stop-color="#c84060"/></radialGradient>
        <filter id="shd"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="rgba(200,80,100,.12)"/></filter>

      <g transform="translate(150,158)">

        <g transform="translate(150,68)" opacity=".65">
          <text x="-18" y="-8" font-size="10" fill="rgba(220,80,100,.7)">♥</text>
          <text x="-2" y="-16" font-size="13" fill="rgba(200,60,80,.75)">♥</text>
          <text x="12" y="-8" font-size="10" fill="rgba(220,80,100,.7)">♥</text>
        </g>
      </g>
    </svg>
  </div>
  <p class="env-hint">✦ &nbsp; tap to open &nbsp; ✦</p>
</div>

<!-- PAGE 2: HEART REVEAL -->
<div class="pg" id="p-heart">
  <div class="heart-card">
    <!-- Photos top -->
    <div class="photos-area" id="photos-area"></div>
    <!-- Bottom -->
    <div class="card-bottom">
      <span class="nametag" id="nametag">untuk kamu ❤️</span>

      <div class="mochi">

        <div class="m-head">

      <!-- Hearts -->
      <div class="heart-grid-wrap">
        <div class="hg" id="hg"></div>
      </div>
    </div>
  </div>
</div>

<!-- PAGE 3: UCAPAN -->
<div class="pg" id="p-msg">
  <div class="msg-deco">💌</div>
  <p class="msg-to" id="msg-to">untuk kamu</p>
  <h1 class="msg-name" id="msg-name">Kamu Istimewa</h1>
  <div class="msg-divider"><div class="msg-line"></div><span class="msg-ico">❤️</span><div class="msg-line"></div></div>
  <p class="msg-text" id="msg-text">Setiap hari kamu ada dalam doa aku.</p>
  <div class="msg-divider"><div class="msg-line"></div><span class="msg-ico">🌹</span><div class="msg-line"></div></div>
  <p class="msg-from" id="msg-from">— dengan sayang</p>
  <div class="msg-nav">
    <button class="msg-btn" id="vid-btn" onclick="goTo('p-vid')" style="display:none">▶ Video</button>
    <button class="msg-btn" onclick="goTo('p-heart')">← Balik</button>
  </div>
</div>

<!-- PAGE 4: VIDEO -->
<div class="pg" id="p-vid">
  <p class="vid-title" id="vid-title">Untuk Kamu 🎥</p>
  <div class="vid-frame" id="vid-frame"></div>
  <div class="vid-divider"><div class="vid-line"></div><span style="font-size:.9rem;opacity:.2">❤️</span><div class="vid-line"></div></div>
  <button class="vid-back" onclick="goTo('p-msg')">← Kembali</button>
</div>

<!-- MUSIC BAR -->
<div id="mbar">
  <div class="mbd" id="mbd"></div>
  <div class="mb-info"><p class="mb-t" id="mb-t">♪</p><p class="mb-a" id="mb-a"></p></div>
  <div class="mb-prog" onclick="seek(event)"><div class="mb-fill" id="mb-fill"></div></div>
  <div class="mb-btns"><button class="mb-btn" id="mb-play" onclick="tgp()">⏸</button><button class="mb-btn" onclick="tgm()">🔊</button></div>
</div>

<div style="position:fixed;bottom:-300px;left:-300px;width:1px;height:1px;overflow:hidden"><div id="ytp"></div></div>

<script>
const SB='https://lejpuajafuenlfvlovfg.supabase.co';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxlanB1YWphZnVlbmxmdmxvdmZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcxMjYyNTAsImV4cCI6MjA5MjcwMjI1MH0.rwABj8DyW3dijUr5TurtMoemZgG2b9LgSHSicUMxMmc';

function goTo(id){
  document.querySelectorAll('.pg').forEach(p=>p.classList.remove('on'));
  const el=document.getElementById(id);
  el.classList.add('on','fade-in');
  setTimeout(()=>el.classList.remove('fade-in'),600);
  window.scrollTo(0,0);
  if(id==='p-msg'){playMusic();showMbar()}
}

/* ── ENVELOPE ── */
function openEnv(){
  const s=document.getElementById('env-scene');
  if(s.classList.contains('opening'))return;
  if(navigator.vibrate)navigator.vibrate([5,25,4]);
  s.classList.add('opening');
  s.style.animation='none';
  document.querySelector('.env-hint').style.opacity='0';
  setTimeout(()=>{
    s.classList.add('gone');
    document.getElementById('p-env').style.transition='opacity .5s';
    document.getElementById('p-env').style.opacity='0';
    setTimeout(()=>{
      document.getElementById('p-env').classList.remove('on');
      document.getElementById('p-env').style.opacity='';
      goTo('p-heart');
      startHearts();
    },500);
  },1050);
}

/* ── HEART GRID ──
   Heart shape positions
*/
function getHeartPos(gridSz){
  // Pixel-art heart shape rows
  const rows=[
    [[1,2],[5,2]],   // two bumps
    [[0,3],[4,3]],
    [[0,8]],
    [[0,8]],
    [[0,8]],
    [[1,6]],
    [[2,4]],
    [[3,2]],
    [[3.5,1]],       // tip
  ];
  const cols=8, cell=gridSz/cols;
  const pts=[];
  rows.forEach((row,ri)=>{
    row.forEach(([sc,cnt])=>{
      for(let ci=0;ci<cnt;ci++){
        pts.push({x:(sc+ci+.5)*cell, y:(ri+.5)*cell*1.04});
      }
    });
  });
  return pts;
}

function startHearts(){
  const hg=document.getElementById('hg');
  const sz=hg.offsetWidth||140;
  const pts=getHeartPos(sz);
  hg.innerHTML='';
  pts.forEach((p,i)=>{
    const h=document.createElement('span');
    h.className='h';h.textContent='❤️';
    h.style.left=p.x+'px';h.style.top=p.y+'px';
    hg.appendChild(h);
    setTimeout(()=>h.classList.add('on'),200+i*52);
  });
  // After all hearts, go to message
  setTimeout(()=>goTo('p-msg'), 200+pts.length*52+2200);
}

/* ── LOAD DATA ── */
async function load(){
  const p=new URLSearchParams(location.search);
  const id=p.get('id');
  if(!id){showErr();return}
  try{
    const r=await fetch(`${SB}/rest/v1/orders?id=eq.${id}&select=*`,{headers:{apikey:KEY,Authorization:'Bearer '+KEY}});
    if(!r.ok)throw new Error();
    const [o]=await r.json();
    if(!o)throw new Error();
    buildUI(o);
    const ld=document.getElementById('p-load');
    ld.style.transition='opacity 1s';ld.style.opacity='0';
    setTimeout(()=>{ld.classList.remove('on');goTo('p-env')},1000);
  }catch(e){showErr()}
}

function showErr(){
  document.getElementById('p-load').innerHTML='<p style="font-size:2rem">💔</p><p style="font-size:.85rem;color:rgba(180,60,80,.6);margin-top:.8rem;font-style:italic">Hadiah tidak dijumpai</p>';
}

function buildUI(o){
  // Names
  if(o.nama2){
    document.getElementById('nametag').textContent=`untuk ${o.nama2} ❤️`;
    document.getElementById('msg-to').textContent=`untuk ${o.nama2}`;
    document.getElementById('msg-name').textContent=o.nama2;
  }
  if(o.nama1) document.getElementById('msg-from').textContent=`— ${o.nama1} ❤️`;
  if(o.ucapan) document.getElementById('msg-text').textContent=o.ucapan;

  // Photos
  const pa=document.getElementById('photos-area');
  const photos=(o.photos||[]).filter(Boolean).slice(0,3);
  if(photos.length){
    photos.forEach((src,i)=>{
      const slot=document.createElement('div');slot.className='photo-slot';
      const img=document.createElement('img');img.src=src;
      slot.appendChild(img);pa.appendChild(slot);
    });
  } else {
    // Placeholder hearts
    ['💕','❤️','🌹'].forEach(e=>{
      const slot=document.createElement('div');slot.className='photo-slot';
      slot.textContent=e;pa.appendChild(slot);
    });
  }

  // Video
  const vf=document.getElementById('vid-frame');
  let hasVid=false;
  if(o.video_url){
    const yt=o.video_url.match(/(?:youtu\.be\/|[?&]v=)([a-zA-Z0-9_-]{11})/);
    if(yt){const i=document.createElement('iframe');i.src=`https://www.youtube.com/embed/${yt[1]}?rel=0&modestbranding=1&playsinline=1`;i.allowFullscreen=true;vf.appendChild(i);hasVid=true}
  } else if(o.lagu_id){
    const i=document.createElement('iframe');i.src=`https://www.youtube.com/embed/${o.lagu_id}?rel=0&modestbranding=1&playsinline=1`;i.allowFullscreen=true;vf.appendChild(i);hasVid=true;
    document.getElementById('vid-title').textContent=o.lagu_nama||'Lagu Kita 🎵';
  }
  if(hasVid)document.getElementById('vid-btn').style.display='inline-block';

  // Music bar
  if(o.lagu_id){
    document.getElementById('mb-t').textContent=o.lagu_nama||'Lagu Kita';
    document.getElementById('mb-a').textContent=o.lagu_artis||'';
    window._lid=o.lagu_id;
  }
}

/* ── MUSIC ── */
let yp=null,yr=false,ypl=false;
function lyt(){if(document.querySelector('script[src*=youtube]'))return;const t=document.createElement('script');t.src='https://www.youtube.com/iframe_api';document.head.appendChild(t)}
window.onYouTubeIframeAPIReady=function(){if(!window._lid)return;yp=new YT.Player('ytp',{height:'1',width:'1',videoId:window._lid,playerVars:{autoplay:0,controls:0,disablekb:1,fs:0,iv_load_policy:3,modestbranding:1,rel:0,playsinline:1},events:{onReady:()=>{yr=true},onStateChange:e=>{if(e.data===1){document.getElementById('mbd').classList.add('sp');document.getElementById('mb-play').textContent='⏸';ypl=true;upBar()}else if(e.data===2||e.data===0){document.getElementById('mbd').classList.remove('sp');document.getElementById('mb-play').textContent='▶';ypl=false}}}})};
function playMusic(){if(!window._lid)return;lyt();const t=setInterval(()=>{if(yr&&yp){yp.playVideo();clearInterval(t)}},200)}
function showMbar(){document.getElementById('mbar').classList.add('on')}
function tgp(){if(!yp)return;ypl?yp.pauseVideo():yp.playVideo()}
function tgm(){if(!yp)return;yp.isMuted()?yp.unMute():yp.mute()}
function seek(e){if(!yp||!yr)return;const r=e.currentTarget.getBoundingClientRect();yp.seekTo((e.clientX-r.left)/r.width*yp.getDuration(),true)}
function upBar(){if(!yp||!ypl)return;const d=yp.getDuration(),c=yp.getCurrentTime();if(d>0)document.getElementById('mb-fill').style.width=(c/d*100)+'%';if(ypl)setTimeout(upBar,800)}

load();
</script>
</body>
</html>
