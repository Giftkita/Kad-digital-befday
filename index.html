<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For You ❤️</title>

<style>
body {
  margin:0;
  height:100vh;
  background: linear-gradient(135deg,#1e1e2f,#ff758c);
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  font-family: 'Segoe UI', sans-serif;
}

/* ENVELOPE */
.envelope {
  width:220px;
  height:140px;
  background:white;
  position:relative;
  cursor:pointer;
  border-radius:8px;
  overflow:hidden;
}

.flap {
  position:absolute;
  width:100%;
  height:100%;
  background:white;
  clip-path: polygon(0 0, 100% 0, 50% 60%);
  transform-origin: top;
  transition:0.6s;
}

.open .flap {
  transform: rotateX(180deg);
}

/* LETTER */
.letter {
  position:absolute;
  width:90%;
  height:120px;
  background:#fff;
  top:20px;
  left:5%;
  border-radius:8px;
  text-align:center;
  padding:10px;
  transform: translateY(50px);
  opacity:0;
  transition:0.6s;
}

.open .letter {
  transform: translateY(-120px);
  opacity:1;
}

/* CONTENT */
.content {
  display:none;
  text-align:center;
  color:white;
}

/* TYPE TEXT */
.typing {
  border-right:2px solid white;
  white-space:nowrap;
  overflow:hidden;
  width:0;
  animation: typing 3s steps(30,end) forwards;
}

@keyframes typing {
  to {width:100%;}
}

/* IMAGES FALL */
.gallery img {
  width:90px;
  border-radius:10px;
  position:absolute;
  top:-100px;
  animation: fall 4s linear forwards;
}

@keyframes fall {
  to {top:100vh;}
}

/* HEART */
.heart {
  position:absolute;
  font-size:20px;
  animation: float 3s linear infinite;
}

@keyframes float {
  from {transform:translateY(0);}
  to {transform:translateY(-300px);}
}

</style>
</head>

<body>

<div class="envelope" onclick="openCard(this)">
  <div class="flap"></div>
  <div class="letter">💌</div>
</div>

<div class="content" id="content">
  <h1 class="typing">Happy Birthday ❤️</h1>
</div>

<script>
function openCard(el){
  el.classList.add("open");

  setTimeout(()=>{
    document.getElementById("content").style.display="block";
    startEffect();
  },800);
}

function startEffect(){
  // hearts
  for(let i=0;i<15;i++){
    let h=document.createElement("div");
    h.className="heart";
    h.innerHTML="❤️";
    h.style.left=Math.random()*100+"vw";
    document.body.appendChild(h);
    setTimeout(()=>h.remove(),3000);
  }

  // falling images
  for(let i=0;i<6;i++){
    let img=document.createElement("img");
    img.src="https://picsum.photos/200?random="+i;
    img.style.left=Math.random()*100+"vw";
    document.body.appendChild(img);
  }
}
</script>

</body>
</html>
